:root {
  /* --pri = ສີສົ້ມເຂັ້ມ ສຳລັບປຸ່ມ/ຂໍ້ຄວາມ (4.5:1 ກັບສີຂາວ); --accent = ສົ້ມສົດ ສຳລັບແຖບ/ຈຸດ/icon ເທົ່ານັ້ນ */
  --bg: #f4f5f7; --card: #fff; --ink: #1f2937; --muted: #6b7280; --line: #eceef1; --line-2: #dfe3e8;
  --pri: #cf4a0e; --accent: #f26522; --pri-2: #fff1e8; --teal: #0e4a55; --teal-2: #e6f0f2;
  --ok: #1f8a4c; --ok-2: #e3f4ea; --warn: #9a5b00; --warn-2: #fff4de; --bad: #c0392b; --bad-2: #fdeaea;
  --r: 14px; --side: 248px;
  --g1: #d64545; --g2: #ef8a2f; --g3: #e7b416; --g4: #7cbf3b; --g5: #1f8a4c;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15.5px/1.7 "Phetsarath OT", "Noto Sans Lao", system-ui, sans-serif;
  padding-bottom: 76px;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { line-height: 1.4; margin: 0 0 8px; color: #111827; }
h1 { font-size: 22px; } h2 { font-size: 18px; } h3 { font-size: 16px; }
p { margin: 0 0 8px; }
a { color: var(--pri); }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.muted { color: var(--muted); font-size: 14px; }
.small { font-size: 13px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 14px 16px; }
:focus-visible { outline: 3px solid #fbc9a8; outline-offset: 2px; }

/* top bar */
#top { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 6; }
#top .bar-in { display: flex; align-items: center; gap: 10px; padding: 8px 16px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: #111827; text-decoration: none; font-size: 17px; }
.brand .mark { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; }
.brand .mark svg.i { width: 18px; height: 18px; stroke-width: 2.2; }
#top .sp { flex: 1; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who .nm { min-width: 0; text-align: right; line-height: 1.3; }
.who .nm b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
.who .nm span { font-size: 12px; color: var(--muted); }
.brand { white-space: nowrap; }
.rchip { display: none !important; }
@media (min-width: 640px) { .rchip { display: inline-flex !important; } }
@media (max-width: 479px) { .who .nm { display: none; } .stat .val { font-size: 21px; } .stat { padding: 12px; } }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.icon-btn { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.icon-btn:hover { color: var(--pri); border-color: var(--line-2); }

/* nav: bottom bar on phones, left sidebar on desktop */
#nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--line); display: flex; justify-content: center; z-index: 5; padding-bottom: env(safe-area-inset-bottom); }
#nav a { flex: 1; max-width: 180px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 6px; text-decoration: none; color: var(--muted); font-size: 12.5px; min-height: 58px; }
#nav a.on { color: var(--pri); font-weight: 700; }
#nav .side-only { display: none; }
#demo-bar { background: var(--warn-2); color: var(--warn); font-size: 14px; }
#demo-bar .wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 6px; padding-bottom: 6px; }
#demo-bar select { padding: 4px 6px; border-radius: 6px; border: 1px solid #e0c48a; background: #fff; max-width: 220px; }

@media (min-width: 1024px) {
  body { padding-bottom: 0; padding-left: var(--side); }
  #top .brand { display: none; }
  #nav { top: 0; bottom: 0; right: auto; width: var(--side); flex-direction: column; justify-content: flex-start; border-top: 0; border-right: 1px solid var(--line); padding: 14px 14px 20px; overflow-y: auto; gap: 2px; }
  #nav .side-only { display: block; }
  #nav .brand.side-only { display: flex; padding: 4px 8px 18px; }
  #nav .sec { font-size: 11.5px; letter-spacing: .04em; color: #9ca3af; padding: 14px 10px 6px; text-transform: uppercase; }
  #nav a { flex: none; max-width: none; flex-direction: row; gap: 10px; min-height: 42px; padding: 8px 12px; border-radius: 10px; font-size: 14.5px; color: #374151; }
  #nav a:hover { background: #f6f7f9; }
  #nav a.on { background: #f1f2f4; color: #111827; }
  #nav a.sub { padding-left: 42px; min-height: 36px; font-size: 13.5px; color: var(--muted); position: relative; }
  #nav a.sub.on { background: none; color: var(--pri); font-weight: 600; }
  #nav a.sub.on::before { content: ""; position: absolute; left: 28px; top: 9px; bottom: 9px; width: 2px; border-radius: 2px; background: var(--accent); }
  #toast { bottom: 24px !important; }
  .sticky { bottom: 12px !important; }
}

/* page head */
.crumbs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 2px 0 12px; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--pri); }
.crumbs .sep { color: #c4c9d0; }
.crumbs b { color: #374151; font-weight: 600; }

/* cards + buttons */
.card { background: var(--card); border-radius: var(--r); padding: 16px 18px; margin: 0 0 14px; border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(16,24,40,.03); }
.card.flat { box-shadow: none; }
.card-h { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
.card-h h2, .card-h h3 { margin: 0; flex: 1; }
.card-h svg.i { color: var(--accent); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 8px 18px; border-radius: 10px; border: 1px solid var(--line-2); background: #fff; cursor: pointer; text-decoration: none; color: var(--ink); font-weight: 600; }
.btn:hover { border-color: #c9ced6; }
.btn.pri { background: var(--pri); border-color: var(--pri); color: #fff; }
.btn.pri:hover { background: #b9420c; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.bad { background: #fff; border-color: var(--bad); color: var(--bad); }
.btn.block { display: flex; width: 100%; }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 13.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.btns .btn { flex: 1 1 140px; }
.link { background: none; border: 0; color: var(--pri); text-decoration: underline; cursor: pointer; padding: 6px 0; min-height: 40px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 10px; border-radius: 999px; font-size: 12.5px; background: var(--pri-2); color: var(--pri); white-space: nowrap; font-weight: 600; }
.chip.ok { background: var(--ok-2); color: var(--ok); } .chip.warn { background: var(--warn-2); color: var(--warn); }
.chip.bad { background: var(--bad-2); color: var(--bad); } .chip.grey { background: #f1f2f4; color: var(--muted); }
.chip.teal { background: var(--teal-2); color: var(--teal); }
.alert { border-radius: 12px; padding: 10px 14px; margin: 0 0 14px; background: var(--warn-2); color: #5f3a00; border: 1px solid #fde3b0; }
.alert.bad { background: var(--bad-2); color: #7d1d14; border-color: #f7c9c4; } .alert.ok { background: var(--ok-2); color: #11512c; border-color: #bfe5cd; }
.alert.info { background: var(--teal-2); color: #0b3a43; border-color: #cfe0e4; }
.back { display: inline-flex; align-items: center; gap: 4px; margin: 0 0 8px; text-decoration: none; min-height: 40px; padding: 6px 0; }

/* stat cards (like the reference dashboard top row) */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 0 0 14px; }
@media (min-width: 900px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13.5px; }
.stat .ico { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; color: #4b5563; flex: none; }
.stat .val { font-size: 26px; font-weight: 700; color: #111827; line-height: 1.25; margin-top: 6px; }
.stat .val small { font-size: 15px; color: var(--muted); font-weight: 600; }
.stat .sub { font-size: 12.5px; color: var(--muted); }
.ticks { display: flex; gap: 3px; align-items: flex-end; height: 26px; margin-top: 6px; }
.ticks i { flex: 1; border-radius: 2px; background: #e9ebee; height: 100%; }
.ticks i.on { background: var(--accent); }

/* duty cards */
.duty { display: flex; gap: 12px; align-items: center; }
.duty .badge { flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--pri-2); color: var(--pri); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.duty.done .badge { background: var(--ok-2); color: var(--ok); }
.duty .t { font-weight: 700; }
@media (min-width: 768px) { .duties { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; } }
.bar { height: 8px; background: #eef0f2; border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
details > summary { cursor: pointer; padding: 8px 0; min-height: 44px; color: var(--muted); }

/* rating 1–5 */
.q { border: 0; margin: 0 0 16px; padding: 0; }
.q legend { padding: 0; margin-bottom: 6px; font-weight: 600; }
.q.miss legend { color: var(--bad); }
.rate { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 560px; }
.rate label { position: relative; }
.rate input { position: absolute; opacity: 0; inset: 0; }
.rate span { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 56px; border: 1px solid var(--line-2); border-radius: 12px; background: #fff; cursor: pointer; text-align: center; line-height: 1.2; }
.rate span:hover { border-color: #c9ced6; }
.rate span b { font-size: 20px; }
.rate span small { font-size: 11px; color: var(--muted); }
.rate input:focus-visible + span { outline: 3px solid #fbc9a8; }
.rate input:checked + span { color: #fff; border-color: transparent; }
.rate input:checked + span small { color: #fff; }
.rate label:nth-child(1) input:checked + span { background: var(--g1); }
.rate label:nth-child(2) input:checked + span { background: var(--g2); }
.rate label:nth-child(3) input:checked + span { background: var(--g3); color: #3d2e00; }
.rate label:nth-child(3) input:checked + span small { color: #3d2e00; }
.rate label:nth-child(4) input:checked + span { background: var(--g4); }
.rate label:nth-child(5) input:checked + span { background: var(--g5); }
.pctrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pctrow .in { width: 110px; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { min-height: 40px; min-width: 52px; border-radius: 8px; border: 1px solid var(--line-2); background: #fff; cursor: pointer; }
.quick button:hover { border-color: var(--accent); color: var(--pri); }
.sticky { position: sticky; bottom: 70px; z-index: 3; box-shadow: 0 -4px 18px rgba(16,24,40,.06); }
.sec-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; border-bottom: 1px solid var(--line); margin: 0 0 12px; padding-bottom: 8px; }

/* fields */
label.f { display: block; margin: 0 0 12px; }
label.f > span { display: block; font-size: 13.5px; color: var(--muted); margin-bottom: 4px; }
.in, select.in, textarea.in { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 10px; background: #fff; }
textarea.in { min-height: 84px; resize: vertical; }
.in:focus { outline: 3px solid #fbd9c4; border-color: var(--accent); }
.check { display: flex; gap: 10px; align-items: center; min-height: 44px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--pri); }

/* KPI editor */
.item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: #fafbfc; }
.wsum { font-weight: 700; padding: 8px 12px; border-radius: 10px; }
.wsum.good { background: var(--ok-2); color: var(--ok); } .wsum.bad { background: var(--bad-2); color: var(--bad); }
.steps { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0 12px; }
.steps span { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: #f1f2f4; color: var(--muted); }
.steps span.done { background: var(--ok-2); color: var(--ok); }
.steps span.cur { background: var(--pri); color: #fff; }

/* tables + lists */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 9px 8px; text-align: left; vertical-align: top; }
.tbl th { color: var(--muted); font-weight: 600; background: #f9fafb; font-size: 13px; }
.tbl tbody tr:hover td { background: #fcfcfd; }
.tbl td.n, .tbl th.n { text-align: right; white-space: nowrap; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.list-row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); min-height: 56px; cursor: pointer; }
.list-row:last-child { border-bottom: 0; }
.tabs { display: flex; gap: 4px; overflow-x: auto; margin: 0 0 14px; padding: 4px; background: #fff; border: 1px solid var(--line); border-radius: 12px; width: max-content; max-width: 100%; }
.tabs a { white-space: nowrap; padding: 6px 14px; border-radius: 8px; text-decoration: none; color: #374151; min-height: 38px; display: flex; align-items: center; font-weight: 600; font-size: 14px; }
.tabs a.on { background: var(--pri); color: #fff; }

/* result */
.big { font-size: 44px; font-weight: 700; line-height: 1.1; color: #111827; }
.grade { display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 16px; font-size: 34px; font-weight: 700; color: #fff; }
.grade.A { background: var(--g5); } .grade.B { background: var(--g4); } .grade.C { background: var(--g3); color: #3d2e00; }
.grade.D { background: var(--g2); } .grade.E { background: var(--g1); } .grade.none { background: #9aa4b1; font-size: 16px; }
/* vertical bar chart (grade distribution) */
.vbars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; align-items: end; height: 190px; padding-top: 6px; }
.vbars .col { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.vbars .track { width: 100%; max-width: 72px; flex: 1; background: #eef0f2; border-radius: 14px; display: flex; align-items: flex-end; overflow: hidden; }
.vbars .fill { width: 100%; background: var(--teal); border-radius: 14px; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; min-height: 30px; }
.vbars .fill.hi { background: var(--accent); }
.vbars .lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

#toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); max-width: calc(100% - 32px); background: #111827; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; white-space: pre-line; }

const GRADES = [[95, 'A', 'ຜົນງານເກີນເປົ້າໝາຍ'], [85, 'B', 'ບັນລຸເປົ້າໝາຍຄົບຖ້ວນ'], [75, 'C', 'ຢູ່ໃນເກນມາດຕະຖານ (ຕ້ອງພັດທະນາຕື່ມ)'],

function pct15(arr) { return arr && arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length / 5 * 100 : null; }
function round1(x) { return Math.round((x + 1e-9) * 10) / 10; }
function grade(total) { return total == null ? null : GRADES.find(g => total >= g[0])[1]; }
function gradeText(g) { const r = GRADES.find(x => x[1] === g); return r ? r[2] : ''; }
function hasSub(cfg, code) { const g = cfg.groups[code]; return !!g && g.split.sub > 0; }
function avg(list) { return list.length ? list.reduce((a, b) => a + b, 0) / list.length : null; }

// items: KPI ດ້ານ I [{w}], f1 = {i:[% ບັນລຸ], iii:[1-5], iv:[1-5]}, f2 = {q:[1-5], s:[1-5]}, f3list/f4list = [{q:[1-5]}]
function score(cfg, code, items, f1, f2, f3list, f4list) {
  const g = cfg.groups[code], w = g.w, sp = g.split;
  const parts = {
    sup: f2 ? pct15(f2.q) : null,
    sac: f2 ? pct15(f2.s) : null,
    peer: avg((f3list || []).map(a => pct15(a.q))),
    sub: sp.sub > 0 ? avg((f4list || []).map(a => pct15(a.q))) : null
  };
  let num = 0, den = 0, redistributed = false;
  for (const k of ['sup', 'sub', 'peer', 'sac']) {
    if (!sp[k]) continue;
    if (parts[k] == null) { redistributed = true; continue; }
    num += parts[k] * sp[k]; den += sp[k];
  }
  const II = (den ? num / den : 0) * w[1] / 100;
  const n = { peer: (f3list || []).length, sub: (f4list || []).length };
  if (!f1) return { complete: false, I: null, II, III: null, IV: null, total: null, grade: null, parts, n, redistributed };
  const I = items.reduce((s, it, idx) => s + (Number(f1.i[idx]) || 0) * it.w / 100, 0);
  const III = (pct15(f1.iii) || 0) * w[2] / 100;
  const IV = w[3] ? (pct15(f1.iv) || 0) * w[3] / 100 : 0;
  const total = round1(I + II + III + IV);
  return { complete: true, I, II, III, IV, total, grade: grade(total), parts, n, redistributed };
}

function validateConfig(cfg) {
  const errs = [];
  for (const [k, g] of Object.entries(cfg.groups || {})) {
    if (g.w.reduce((a, b) => a + Number(b), 0) !== 100) errs.push(`ກຸ່ມ ${g.name}: ນ້ຳໜັກ 4 ດ້ານ ລວມຕ້ອງ = 100`);
    if (Object.values(g.split).reduce((a, b) => a + Number(b), 0) !== 100) errs.push(`ກຸ່ມ ${g.name}: ສັດສ່ວນດ້ານ II ລວມຕ້ອງ = 100`);
    if (!g.iii.length) errs.push(`ກຸ່ມ ${g.name}: ຕ້ອງມີລາຍການດ້ານ III`);
    if (g.w[3] > 0 && !g.iv.length) errs.push(`ກຸ່ມ ${g.name}: ຕ້ອງມີລາຍການດ້ານ IV`);
    if (!cfg.questions[g.q2]) errs.push(`ກຸ່ມ ${g.name}: ບໍ່ພົບຊຸດຄຳຖາມ ${g.q2}`);
  }
  for (const q of ['sac', 'peer', 'sub']) if (!(cfg.questions[q] || []).length) errs.push(`ຊຸດຄຳຖາມ ${q} ຫວ່າງ`);
  return errs;
}

if (typeof module !== 'undefined') module.exports = { DEFAULT_CONFIG, GRADES, pct15, round1, grade, gradeText, hasSub, score, validateConfig };

/* ===== server.js ===== */
// ກົດລະບຽບ ແລະ ສິດທັງໝົດ ຢູ່ບ່ອນນີ້. ແລ່ນໄດ້ທັງ Apps Script, browser (ໂໝດທົດລອງ) ແລະ node tests.
// store = {load, save(db, tables), hash, now, uuid, lock(fn)}
const SC = typeof require !== 'undefined' && typeof module !== 'undefined'
  ? require('./scoring.js') : { DEFAULT_CONFIG, score, hasSub, validateConfig };
const TABLES = ['staff', 'rounds', 'kpi', 'peers', 'answers', 'sessions', 'results', 'roles'];

// ສິດທີ່ Admin ກຳນົດໃຫ້ແຕ່ລະບົດບາດໄດ້. ADMIN ມີທຸກສິດ ແລະ ແກ້ໄຂບໍ່ໄດ້.
const PERMS = ['staff', 'roles', 'round', 'peers', 'config', 'kpiReview', 'kpiFinal', 'progress', 'results'];
const DEFAULT_ROLES = [
  { code: 'ADMIN', name: 'ຜູ້ດູແລລະບົບ (Admin)', perms: PERMS.slice() },
  { code: 'HR', name: 'HR', perms: PERMS.filter(p => p !== 'roles' && p !== 'kpiFinal') },
  { code: 'PRESIDENT', name: 'ປະທານ', perms: ['kpiFinal'] }
];
const clone = o => JSON.parse(JSON.stringify(o));

function permsOf(s, roles) {
  return new Set((s.roles || []).flatMap(c => (roles.find(r => r.code === c) || { perms: [] }).perms));
}
function E(msg) { const e = new Error(msg); e.user = true; return e; }
const NOAUTH = 'ກະລຸນາເຂົ້າລະບົບໃໝ່';
const NOPERM = 'ທ່ານບໍ່ມີສິດເຮັດລາຍການນີ້';

function handle(req, store) {
  try { return store.lock(() => run(req || {}, store)); }
  catch (e) { return { ok: false, err: e.user ? e.message : 'ລະບົບຜິດພາດ: ' + e.message }; }
}

function run(req, store) {
  const db = store.load();
  for (const k of TABLES) db[k] = db[k] || [];
  if (!db.roles.length) db.roles = clone(DEFAULT_ROLES);
  const adm = db.roles.find(r => r.code === 'ADMIN');
  if (adm) adm.perms = PERMS.slice(); else db.roles.unshift(clone(DEFAULT_ROLES[0]));
  const X = ctx(db, db.config || clone(SC.DEFAULT_CONFIG), store);
  if (req.a === 'login') return login(X, req);
  const fn = ACTIONS[req.a];
  if (!fn) throw E('ບໍ່ຮູ້ຈັກຄຳສັ່ງ');
  const u = X.auth(req.t);
  fn(X, u, req);
  if (X.ch.size) store.save(db, [...X.ch]);
  return { ok: true, boot: boot(X, u, req) };
}

function ctx(db, cfg, store) {
  const X = { db, cfg, store, ch: new Set(), now: store.now() };
  X.by = code => db.staff.find(s => s.code === code);
  X.active = () => db.staff.filter(s => s.active !== false);
  X.evaluated = s => !!s && s.active !== false && !!cfg.groups[s.group];
  X.subs = code => X.active().filter(s => s.sup === code);
  // bootstrap: ຖ້າບໍ່ມີໃຜມີສິດ "ກຳນົດສິດ", ຄົນທີ່ມີສິດ "ຈັດການພະນັກງານ" ໄດ້ສິດນັ້ນ (ກັນລັອກຕົນເອງອອກ)
  X.perms = u => {
    const p = permsOf(u, db.roles);
    if (!p.has('roles') && p.has('staff') && !X.active().some(s => permsOf(s, db.roles).has('roles'))) p.add('roles');
    return p;
  };
  X.can = (u, p) => X.perms(u).has(p);
  X.pres = () => X.active().find(s => X.can(s, 'kpiFinal'));
  X.approverOf = e => { if (e.appr) return e.appr; const s = X.by(e.sup); return (s && s.sup) || null; };
  X.openRound = () => db.rounds.find(r => r.status === 'setup' || r.status === 'eval');
  X.round = id => (id && db.rounds.find(r => r.id === id)) || X.openRound() || db.rounds[db.rounds.length - 1] || null;
  X.kpi = (rid, emp) => db.kpi.find(k => k.round === rid && k.emp === emp);
  X.subAns = (rid, form, emp) => db.answers.filter(a => a.round === rid && a.form === form && a.emp === emp && a.status === 'sub');
  X.auth = t => {
    const s = t && db.sessions.find(x => x.t === t && x.exp > X.now);
    const u = s && X.by(s.code);
    if (!u || u.active === false) throw E(NOAUTH);
    return u;
  };
  X.need = cond => { if (!cond) throw E(NOPERM); };
  return X;
}

// ---------- login ----------
function login(X, req) {
  const code = String(req.code || '').trim().toUpperCase();
  const s = X.db.staff.find(x => x.code === code && x.active !== false);
  if (!s || !s.pin) throw E('ລະຫັດ ຫຼື PIN ບໍ່ຖືກ');
  if ((s.lockUntil || 0) > X.now) throw E('ໃສ່ PIN ຜິດຫຼາຍເທື່ອ, ລອງໃໝ່ຫຼັງ 15 ນາທີ');
  if (X.store.hash(String(req.pin || '')) !== s.pin) {
    s.fails = (s.fails || 0) + 1;
    if (s.fails >= 5) { s.lockUntil = X.now + 15 * 60e3; s.fails = 0; }
    X.store.save(X.db, ['staff']);
    throw E('ລະຫັດ ຫຼື PIN ບໍ່ຖືກ');
  }
  s.fails = 0; s.lockUntil = 0;
  X.db.sessions = X.db.sessions.filter(x => x.exp > X.now);
  const t = X.store.uuid();
  X.db.sessions.push({ t, code: s.code, exp: X.now + 30 * 864e5 });
  X.store.save(X.db, ['staff', 'sessions']);
  return { ok: true, token: t, boot: boot(X, s, req) };
}

// ---------- KPI ----------
function kpiFor(X, u, emp, wantSup) {
  const r = X.openRound();
  if (!r) throw E('ບໍ່ມີຮອບປະເມີນທີ່ເປີດຢູ່');
  const e = X.by(emp);
  if (!X.evaluated(e)) throw E('ບໍ່ພົບພະນັກງານທີ່ຖືກປະເມີນ');
  if (wantSup) X.need(e.sup === u.code);
  return { r, e, k: X.kpi(r.id, e.code) };
}
function hist(X, k, u, act, msg) { k.hist = (k.hist || []).concat({ at: X.now, by: u.code, act, msg: msg || '' }); X.ch.add('kpi'); }
function decide(X, u, k, ok, msg, next) {

  k.status = ok ? next : 'draft';

}

function kpiSave(X, u, req) {

  const items = req.items;
  if (!Array.isArray(items) || !items.length || items.length > 10) throw E('ຕ້ອງມີຕົວຊີ້ວັດ 1–10 ຂໍ້');
  const clean = items.map(it => {
    const t = String(it.t || '').trim().slice(0, 200), w = Number(it.w);
    if (!t) throw E('ກະລຸນາໃສ່ຊື່ຕົວຊີ້ວັດ');
    if (!(w > 0 && w <= 100)) throw E('ນ້ຳໜັກຕ້ອງຢູ່ລະຫວ່າງ 1–100');
    return { t, target: String(it.target || '').trim().slice(0, 300), w };
  });
  if (k) k.items = clean;

}
function kpiSubmit(X, u, req) {
  const { e, k } = kpiFor(X, u, req.emp, true);
  if (!k || k.status !== 'draft') throw E('ບໍ່ມີ KPI ຮ່າງ ໃຫ້ສົ່ງ');
  const need = X.cfg.groups[e.group].w[0], sum = k.items.reduce((s, it) => s + it.w, 0);
  if (Math.abs(sum - need) > 1e-9) throw E(`ນ້ຳໜັກລວມຕ້ອງ = ${need}% (ດຽວນີ້ ${sum}%)`);
  k.status = 'ack'; hist(X, k, u, 'ສົ່ງໃຫ້ພະນັກງານຮັບຮູ້');
}
function kpiAck(X, u, req) {

  if (!k || k.status !== 'ack') throw E('ບໍ່ມີ KPI ລໍຖ້າຮັບຮູ້');
  if (!req.ok && !String(req.msg || '').trim()) throw E('ກະລຸນາຂຽນເຫດຜົນທີ່ຂໍສົນທະນາ');

}
function kpiHr(X, u, req) {

  if (!k || k.status !== 'hr') throw E('KPI ນີ້ບໍ່ໄດ້ລໍຖ້າ HR ກວດ');

    const { k } = kpiFor(X, u, emp, false);
    if (!k || k.status !== 'pres') throw E('KPI ບາງລາຍການບໍ່ໄດ້ລໍຖ້າປະທານ');

// ---------- answers ----------
function canEval(X, u, form, e, r) {
  if (form === 1 || form === 2) return e.sup === u.code;
  if (form === 3) return X.db.peers.some(p => p.round === r.id && p.emp === e.code && p.by === u.code);
  if (form === 4) return u.sup === e.code && SC.hasSub(X.cfg, e.group);

function cleanAns(X, form, e, k, a) {
  const g = X.cfg.groups[e.group], Q = X.cfg.questions;
  const r15 = (arr, n) => {
    if (!Array.isArray(arr) || arr.length !== n || !arr.every(v => Number.isInteger(v) && v >= 1 && v <= 5))
      throw E('ກະລຸນາໃຫ້ຄະແນນຄົບທຸກຂໍ້');
    return arr;
  };
  const txt = v => String(v || '').slice(0, 2000);
  if (form === 1) {
    const i = a.i;
    if (!Array.isArray(i) || i.length !== k.items.length || !i.every(v => typeof v === 'number' && v >= 0 && v <= 100))
      throw E('ກະລຸນາໃສ່ % ບັນລຸ (0–100) ທຸກຕົວຊີ້ວັດ');
    return { i, iii: r15(a.iii, g.iii.length), iv: r15(a.iv || [], g.w[3] ? g.iv.length : 0), str: txt(a.str), imp: txt(a.imp), cmt: txt(a.cmt) };
  }
  if (form === 2) return { q: r15(a.q, Q[g.q2].length), s: r15(a.s, Q.sac.length), note: txt(a.note) };

function answerSubmit(X, u, req) {
  const r = X.openRound();
  if (!r || r.status !== 'eval') throw E('ຍັງບໍ່ເປີດໃຫ້ປະເມີນ');
  const form = Number(req.form), e = X.by(req.emp);
  if (!X.evaluated(e)) throw E('ບໍ່ພົບຜູ້ຖືກປະເມີນ');
  X.need(canEval(X, u, form, e, r));
  const k = X.kpi(r.id, e.code);
  if (form === 1 && (!k || k.status !== 'ok')) throw E('KPI ຂອງຄົນນີ້ຍັງບໍ່ໄດ້ອະນຸມັດ');
  const ans = cleanAns(X, form, e, k, req.ans || {});
  const prev = X.db.answers.find(a => a.round === r.id && a.form === form && a.emp === e.code && a.by === u.code);
  if (prev && prev.status === 'sub') throw E('ທ່ານສົ່ງຟອມນີ້ແລ້ວ');
  if (prev) Object.assign(prev, { ans, status: 'sub', at: X.now });
  else X.db.answers.push({ id: X.store.uuid(), round: r.id, form, emp: e.code, by: u.code, ans, status: 'sub', at: X.now });

}
function answerReopen(X, u, req) {

  if (!a) throw E('ບໍ່ພົບຟອມ');
  const r = X.db.rounds.find(x => x.id === a.round);
  if (!r || r.status !== 'eval') throw E('ເປີດຄືນໄດ້ສະເພາະຕອນຮອບກຳລັງປະເມີນ');

// ---------- results ----------
function result(X, r, e) {
  const k = X.kpi(r.id, e.code);
  const latest = f => { const l = X.subAns(r.id, f, e.code); return l.length ? l.reduce((a, b) => (a.at >= b.at ? a : b)).ans : null; };
  const assigned = new Set(X.db.peers.filter(p => p.round === r.id && p.emp === e.code).map(p => p.by));
  const f3 = X.subAns(r.id, 3, e.code).filter(a => assigned.has(a.by)).map(a => a.ans);
  const f4 = SC.hasSub(X.cfg, e.group) ? X.subAns(r.id, 4, e.code).map(a => a.ans) : [];
  const f1 = k && k.status === 'ok' ? latest(1) : null;
  const sc = SC.score(X.cfg, e.group, k ? k.items : [], f1, latest(2), f3, f4);
  return Object.assign({ emp: e.code, name: e.name, dept: e.dept, group: e.group, round: r.id, items: k ? k.items : [], f1, few: {} }, sc);

  return m;

// ---------- round / staff / peers / config (HR) ----------
function roundCreate(X, u, req) {
  X.need(X.can(u, 'round'));
  if (X.openRound()) throw E('ຍັງມີຮອບທີ່ເປີດຢູ່ — ປິດກ່ອນຈຶ່ງສ້າງຮອບໃໝ່');
  const name = String(req.name || '').trim().slice(0, 60);
  if (!name) throw E('ກະລຸນາໃສ່ຊື່ຮອບ');
  const prev = X.db.rounds[X.db.rounds.length - 1];
  const r = { id: 'R' + X.now.toString(36), name, status: 'setup', at: X.now };
  X.db.rounds.push(r); X.ch.add('rounds');
  if (req.copyKpi && prev) {
    for (const k of X.db.kpi.filter(k => k.round === prev.id))
      X.db.kpi.push({ id: X.store.uuid(), round: r.id, emp: k.emp, items: clone(k.items), status: 'draft', hist: [] });

  }
}
function roundStatus(X, u, req) {
  X.need(X.can(u, 'round'));
  const r = X.db.rounds.find(x => x.id === req.id);
  if (!r) throw E('ບໍ່ພົບຮອບ');
  if (!(ROUND_FLOW[r.status] || []).includes(req.status)) throw E('ປ່ຽນສະຖານະແບບນີ້ບໍ່ໄດ້');

  if (req.status === 'closed') {
    const rows = X.active().filter(X.evaluated).map(e => {
      const x = result(X, r, e);
      return { round: r.id, emp: e.code, name: e.name, dept: e.dept, group: e.group, I: x.I, II: x.II, III: x.III, IV: x.IV, total: x.total, grade: x.grade };

function cleanStaff(X, row, old) {
  const code = String(row.code || '').trim().toUpperCase();

  const name = String(row.name || '').trim().slice(0, 100);

    document.body.appendChild(a); a.click(); a.remove();
  }

  document.addEventListener('click', e => {
    const go2 = e.target.closest('[data-go]');
    if (go2 && !e.target.closest('a,button')) return go(go2.dataset.go);
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    e.preventDefault();
    ACT[el.dataset.act](el, e);
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest('[data-submit]');
    if (!f) return;
    e.preventDefault(); SUBMIT[f.dataset.submit](f);
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.kf && A.kedit) { A.kedit.items[Number(t.dataset.i)][t.dataset.kf] = t.value; updWsum(); }
    else if (t.closest('#fm')) updLive();
    else if (t.id === 'rq') { A.rq = t.value; render(); const q = $('#rq'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    else if (t.id === 'hr-q') { A.hrQ = t.value; render(); const q = $('#hr-q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.closest('#fm')) updLive();
    else if (t.id === 'hr-dept') { A.hrDept = t.value; render(); }
    else if (t.id === 'hr-todo') { A.hrTodo = t.checked; render(); }
    else if (t.classList.contains('rmem')) {
      const l = A.rsel.list;
      if (t.checked) { if (!l.includes(t.value)) l.push(t.value); } else l.splice(l.indexOf(t.value), 1);
      const h3 = $('#rmem-n'); if (h3) h3.textContent = `ຄົນທີ່ມີບົດບາດນີ້ (${l.length})`;
    }
    else if (t.id === 'pres-all') $$('.pres-k').forEach(x => { x.checked = t.checked; });
    else if (t.classList.contains('peer-c')) {
      const l = A.peerSel.list;
      if (t.checked) { if (!l.includes(t.value)) l.push(t.value); } else l.splice(l.indexOf(t.value), 1);
      render();
    } else if (t.id === 'demo-who') {
      const code = t.value;
      call('logout', {}, { noRender: true }).then(() => call('login', { code, pin: '1234' })).then(r => { if (r.ok) go('#home'); });
    }
  });
  window.addEventListener('hashchange', render);

  // ---------- start ----------
  const qApi = new URLSearchParams(location.search).get('api');
  if (qApi && /^https:\/\/script\.google\.com\/.+\/exec$/.test(qApi)) {
    LSS('kpi_api', qApi); LSS('kpi_mode', 'live'); A.api = qApi; A.mode = 'live';
    history.replaceState(null, '', location.pathname + location.hash);
  }
  if (A.mode === 'demo') A.store = makeDemoStore();
  if (A.mode && LSG(tokKey())) call('boot'); else render();
})();
