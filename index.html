:root {
  --bg: #eef5f1; --card: #fff; --ink: #0f2623; --head: #07312d; --muted: #43544f; --line: #e6eeea; --line-2: #d3dfd9;
  /* --pri = ສີຂຽວເຂັ້ມ (ປຸ່ມ/ລິ້ງ, 7.5:1 ກັບຂາວ); --accent/--mint/--lime = ສີແຖບ/ກຣາຟ ເທົ່ານັ້ນ (ບໍ່ໃຊ້ເປັນສີຕົວໜັງສື) */
  --pri: #0f5f57; --pri-d: #0b4f49; --pri-2: #e3f2ec; --accent: #4fae80; --mint: #7cc79a; --lime: #d6ea71; --lime-2: #eef5c4; --teal: #0b4f49; --teal-2: #e3f2ec;
  --ok: #146c39; --ok-2: #e1f3e8; --warn: #8a5300; --warn-2: #fff4de; --bad: #b3261e; --bad-2: #fdeaea;
  --r: 20px; --rail: 88px; --side: 312px;
  --g1: #d64545; --g2: #ef8a2f; --g3: #e7b416; --g4: #7cbf3b; --g5: #1f8a4c;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); background: var(--bg) linear-gradient(135deg, #dcefe5 0%, #eef5f1 38%, #f6f9f4 100%) fixed;
  font: 500 17px/1.75 "Noto Sans Lao", "Phetsarath OT", system-ui, sans-serif;
  padding-bottom: 76px;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { line-height: 1.4; margin: 0 0 8px; color: var(--head); }
h1 { font-size: clamp(22px, 3.2vw, 30px); font-weight: 700; } h2 { font-size: 18px; } h3 { font-size: 16px; }
p { margin: 0 0 8px; }
a { color: var(--pri); }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.muted { color: var(--muted); font-size: 15px; }
.small { font-size: 14px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 14px 16px; }
:focus-visible { outline: 3px solid #86cfa9; outline-offset: 2px; }

/* top bar */
#top { background: rgba(255,255,255,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 6; }
#top .bar-in { display: flex; align-items: center; gap: 10px; padding: 8px 16px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--head); text-decoration: none; font-size: 17px; white-space: nowrap; }
.brand .mark { width: 36px; height: 36px; border-radius: 12px; background: var(--pri); color: var(--lime); display: grid; place-items: center; flex: none; }
.brand .mark svg.i { width: 20px; height: 20px; stroke-width: 2.1; }
#top .sp { flex: 1; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who .nm { min-width: 0; text-align: right; line-height: 1.3; }
.who .nm b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
.who .nm span { font-size: 13.5px; color: var(--muted); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--pri); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line-2); background: #fff; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.icon-btn:hover { color: var(--pri); border-color: var(--accent); }
.rchip { display: none !important; }
@media (min-width: 640px) { .rchip { display: inline-flex !important; } }
@media (max-width: 479px) { .who .nm { display: none; } .stat .val { font-size: 21px; } .stat { padding: 12px; } }

/* nav: bottom bar on phones, left icon rail on desktop */
#nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--line); display: flex; justify-content: center; z-index: 5; padding-bottom: env(safe-area-inset-bottom); }
#nav a { flex: 1; max-width: 180px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 6px; text-decoration: none; color: var(--muted); font-size: 13.5px; min-height: 58px; }
#nav a.on { color: var(--pri); font-weight: 700; }
#nav a.on svg { background: var(--lime); box-sizing: content-box; padding: 3px 14px; border-radius: 99px; }
#nav .side-only { display: none; }
#demo-bar { background: var(--warn-2); color: var(--warn); font-size: 15px; }
#demo-bar .wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 6px; padding-bottom: 6px; }
#demo-bar select { padding: 4px 6px; border-radius: 6px; border: 1px solid #e0c48a; background: #fff; max-width: 220px; }
#side { display: none; }

@media (min-width: 1024px) {
  body.app { padding-bottom: 0; padding-left: var(--rail); }
  #top .brand { display: none; }
  #nav { top: 0; bottom: 0; right: auto; width: var(--rail); flex-direction: column; justify-content: flex-start; align-items: center; border-top: 0; border-right: 1px solid var(--line); padding: 18px 8px 20px; gap: 8px; }
  #nav .side-only { display: flex; }
  #nav .brand { margin-bottom: 14px; }
  #nav a { flex: none; max-width: none; width: 72px; min-height: 66px; padding: 10px 4px; border-radius: 18px; justify-content: center; line-height: 1.25; text-align: center; position: relative; }
  #nav a svg { width: 22px; height: 22px; }
  #nav a:hover { background: #f1f7f4; color: var(--pri); }
  #nav a.on { background: var(--pri-2); }
  #nav a.on svg { background: none; padding: 0; border-radius: 0; }
  #nav a.on::before { content: ""; position: absolute; left: -8px; top: 20px; bottom: 20px; width: 4px; border-radius: 0 4px 4px 0; background: var(--accent); }
  #toast { bottom: 24px !important; }
  .sticky { bottom: 12px !important; }
}
@media (min-width: 1280px) {
  body.app { padding-right: var(--side); }
  body.app #top { display: none; }
  body.app #side { display: block; }
}

/* right profile panel (like the reference) */
#side { position: fixed; top: 0; right: 0; bottom: 0; width: var(--side); z-index: 4; overflow: hidden; color: #fff;
  background:
    radial-gradient(circle at 18% 6%, rgba(255,255,255,.85) 0 1px, transparent 1.6px), radial-gradient(circle at 72% 4%, rgba(255,255,255,.7) 0 1.2px, transparent 1.8px),
    radial-gradient(circle at 44% 11%, rgba(255,255,255,.6) 0 1px, transparent 1.6px), radial-gradient(circle at 90% 14%, rgba(255,255,255,.75) 0 1px, transparent 1.6px),
    radial-gradient(circle at 8% 19%, rgba(255,255,255,.55) 0 1px, transparent 1.6px), radial-gradient(circle at 60% 20%, rgba(255,255,255,.6) 0 1px, transparent 1.6px),
    linear-gradient(180deg, #0b3b4d 0%, #0e5a62 38%, #2f8f78 72%, #5fb98c 100%); }
.side-in { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 20px 22px; }
.side-top { align-self: stretch; display: flex; justify-content: flex-start; }
.gchip { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.16); color: #fff; border-radius: 99px; padding: 2px 12px; font-size: 14px; }
.gchip svg.i { width: 16px; height: 16px; }
.avatar.xl { width: 84px; height: 84px; font-size: 34px; background: #fff; color: var(--pri); border: 4px solid rgba(255,255,255,.35); margin-top: 16px; }
.side-name { font-size: 19px; font-weight: 700; margin-top: 10px; line-height: 1.4; }
.side-pos { font-size: 14.5px; color: rgba(255,255,255,.88); }
.side-roles { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.side-btn { margin-top: 16px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 22px; border-radius: 99px; border: 0; background: #fff; color: var(--head); font-weight: 600; cursor: pointer; box-shadow: 0 8px 18px -8px rgba(0,0,0,.4); }
.side-btn:hover { background: var(--lime-2); }
.side-lab { margin-top: 22px; font-weight: 600; }
.side-box { margin-top: 8px; display: flex; align-self: stretch; text-align: left; background: rgba(255,255,255,.16); border-radius: 16px; padding: 8px; }
.sb-a { flex: 1.25; background: #fff; color: var(--head); padding: 6px 22px 6px 12px; border-radius: 10px 0 0 10px; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%); }
.sb-b { flex: 1; padding: 6px 4px 6px 16px; }
.side-box small { display: block; font-size: 13px; line-height: 1.4; }
.sb-a small { color: var(--muted); } .sb-b small { color: rgba(255,255,255,.88); }
.side-box b { display: block; font-size: 15px; line-height: 1.4; }
.side-org { margin-top: 24px; font-size: 24px; font-weight: 700; line-height: 1.35; }
.side-sub { font-size: 14px; color: rgba(255,255,255,.9); margin-top: 4px; }
#side .city { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: min(46%, 340px); z-index: 0; }

/* page head */
.crumbs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin: 2px 0 12px; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--pri); }
.crumbs .sep { color: #b4c4bd; }
.crumbs b { color: var(--head); font-weight: 600; }

/* cards + buttons */
.card { background: var(--card); border-radius: var(--r); padding: 18px 20px; margin: 0 0 16px; border: 1px solid var(--line); box-shadow: 0 10px 28px -20px rgba(11,79,73,.35); }
.card.flat { box-shadow: none; }
.card-h { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
.card-h h2, .card-h h3 { margin: 0; flex: 1; }
.card-h svg.i { color: var(--pri); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 8px 20px; border-radius: 999px; border: 1px solid var(--line-2); background: #fff; cursor: pointer; text-decoration: none; color: var(--ink); font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--pri); border-color: var(--pri); color: #fff; }
.btn.pri:hover { background: var(--pri-d); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.bad { background: #fff; border-color: var(--bad); color: var(--bad); }
.btn.block { display: flex; width: 100%; }
.btn.sm { min-height: 36px; padding: 4px 14px; font-size: 14.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.btns .btn { flex: 1 1 140px; }
.pill-btn { display: inline-flex; align-items: center; min-height: 36px; padding: 4px 16px; border-radius: 99px; background: var(--pri); color: #fff; font-weight: 600; font-size: 14.5px; text-decoration: none; white-space: nowrap; }
.link { background: none; border: 0; color: var(--pri); text-decoration: underline; cursor: pointer; padding: 6px 0; min-height: 40px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 10px; border-radius: 999px; font-size: 13.5px; background: var(--pri-2); color: var(--pri); white-space: nowrap; font-weight: 600; }
.chip.ok { background: var(--ok-2); color: var(--ok); } .chip.warn { background: var(--warn-2); color: var(--warn); }
.chip.bad { background: var(--bad-2); color: var(--bad); } .chip.grey { background: #eef2f0; color: var(--muted); }
.chip.teal { background: var(--teal-2); color: var(--teal); }
.alert { border-radius: 14px; padding: 10px 14px; margin: 0 0 14px; background: var(--warn-2); color: #5f3a00; border: 1px solid #fde3b0; }
.alert.bad { background: var(--bad-2); color: #7d1d14; border-color: #f7c9c4; } .alert.ok { background: var(--ok-2); color: #0f4f29; border-color: #bfe5cd; }
.alert.info { background: var(--teal-2); color: #0b3a43; border-color: #cfe5da; }
.back { display: inline-flex; align-items: center; gap: 4px; margin: 0 0 8px; text-decoration: none; min-height: 40px; padding: 6px 0; }

/* stat cards (HR) */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 0 0 16px; }
@media (min-width: 900px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 14.5px; }
.stat .ico { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; color: var(--pri); flex: none; }
.stat .val { font-size: 26px; font-weight: 700; color: var(--head); line-height: 1.25; margin-top: 6px; }
.stat .val small { font-size: 15px; color: var(--muted); font-weight: 600; }
.stat .sub { font-size: 13.5px; color: var(--muted); }
.ticks { display: flex; gap: 3px; align-items: flex-end; height: 26px; margin-top: 6px; }
.ticks i { flex: 1; border-radius: 2px; background: #e4ece8; height: 100%; }
.ticks i.on { background: var(--accent); }

/* home dashboard */
.dash { display: grid; gap: 16px; margin: 0 0 16px; }
.dash2 { display: grid; gap: 16px; margin: 0 0 16px; align-items: start; }
.dash2 .sched { order: -1; }
@media (min-width: 900px) {
  .dash { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); align-items: start; }
  .dash2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dash2 .sched { order: 0; }
  .dash2.one { grid-template-columns: minmax(0, 1fr); }
}
.dash .card, .dash2 .card { margin: 0; }
.stages { display: grid; gap: 12px; }
.stage { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 14px; align-items: center; border-radius: 20px; padding: 14px 16px; box-shadow: 0 14px 26px -18px rgba(11,79,73,.6); }
.s1 { background: var(--lime); color: #0b3d38; } .s2 { background: var(--mint); color: #06302c; } .s3 { background: var(--teal); color: #fff; }
.stage .arrow { width: 74px; height: 66px; background: #fff; color: var(--head); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; padding-right: 12px; border-radius: 12px 0 0 12px; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); }
.stage .arrow small { font-size: 13px; color: var(--muted); } .stage .arrow b { font-size: 26px; }
.stage .lab { font-weight: 700; line-height: 1.4; }
.stage .pct { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.mbar { flex: 1; max-width: 170px; height: 6px; border-radius: 99px; background: rgba(0,0,0,.14); overflow: hidden; }
.s3 .mbar { background: rgba(255,255,255,.24); }
.mbar i { display: block; height: 100%; background: currentColor; border-radius: 99px; }
.pchip { background: #fff; color: var(--head); border-radius: 99px; padding: 0 10px; font-size: 13.5px; font-weight: 700; }
.metrics { grid-column: 1 / -1; display: flex; gap: 22px; }
.metrics div { display: flex; flex-direction: column; line-height: 1.3; }
.metrics span { font-size: 13px; opacity: .9; } .metrics b { font-size: 17px; }
@media (min-width: 560px) { .stage { grid-template-columns: auto minmax(0, 1fr) auto; } .metrics { grid-column: auto; } }
.donutcard { text-align: center; }
.dc-title { font-size: 17px; margin-bottom: 10px; }
.donut { position: relative; width: 150px; height: 150px; margin: 6px auto 16px; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut circle { fill: none; stroke-width: 9; }
.donut .dt { stroke: #e4efe9; } .donut .dp { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.donut .dc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
.dc b { font-size: 28px; color: var(--head); } .dc small { font-size: 13.5px; color: var(--muted); }
.pr { text-align: left; margin: 0 0 12px; font-size: 15px; }
.pbar { height: 6px; background: #e4efe9; border-radius: 99px; overflow: hidden; margin-top: 4px; }
.pbar i { display: block; height: 100%; border-radius: 99px; }
.pbar.b1 i { background: var(--accent); } .pbar.b2 i { background: var(--teal); } .pbar.b3 i { background: #b5d23f; }
@media (prefers-reduced-motion: reduce) { .donut .dp { transition: none; } }
.srow { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); min-height: 60px; color: inherit; text-decoration: none; }
.srow:last-child { border-bottom: 0; }
a.srow:hover .t { color: var(--pri); }
.sico { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; color: var(--pri); background: #fff; }
.srow.done .sico { background: var(--ok-2); border-color: transparent; color: var(--ok); }
.srow .t { font-weight: 700; color: var(--head); line-height: 1.4; }
details > summary.pill-sum { display: flex; justify-content: center; align-items: center; min-height: 46px; margin: 14px auto 4px; max-width: 300px; padding: 0 22px; background: var(--pri); color: #fff; border-radius: 99px; font-weight: 600; list-style: none; cursor: pointer; box-shadow: 0 12px 20px -10px rgba(11,79,73,.55); }
details > summary.pill-sum::-webkit-details-marker { display: none; }
/* chevron step bar (like the reference's activity bars) */
.chev { display: flex; flex-wrap: wrap; gap: 6px 0; margin: 4px 0 12px; }
.chev span { padding: 5px 16px 5px 22px; font-size: 13.5px; background: #edf3f0; color: var(--muted); margin-right: -6px; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%, 10px 50%); }
.chev span:first-child { padding-left: 14px; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%); border-radius: 8px 0 0 8px; }
.chev span.done { background: var(--lime); color: #0b3d38; }
.chev span.cur { background: var(--teal); color: #fff; font-weight: 600; }

/* duty cards (kept for other screens) */
.duty { display: flex; gap: 12px; align-items: center; }
.duty .badge { flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--pri-2); color: var(--pri); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.duty .t { font-weight: 700; }
.bar { height: 8px; background: #e4efe9; border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
details > summary { cursor: pointer; padding: 8px 0; min-height: 44px; color: var(--muted); }

/* rating 1–5 */
.q { border: 0; margin: 0 0 16px; padding: 0; }
.q legend { padding: 0; margin-bottom: 6px; font-weight: 600; }
.q.miss legend { color: var(--bad); }
.rate { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.rate label { position: relative; }
.rate input { position: absolute; opacity: 0; inset: 0; }
.rate span { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 56px; border: 1px solid var(--line-2); border-radius: 14px; background: #fff; cursor: pointer; text-align: center; line-height: 1.2; }
.rate span:hover { border-color: var(--accent); }
.rate span b { font-size: 20px; }
.rate span small { font-size: 13px; color: var(--muted); }
.rate input:focus-visible + span { outline: 3px solid #86cfa9; }
.rate input:checked + span { color: #fff; border-color: transparent; }
.rate input:checked + span small { color: #fff; }
.rate label:nth-child(1) input:checked + span { background: var(--g1); }
.rate label:nth-child(2) input:checked + span { background: var(--g2); }
.rate label:nth-child(3) input:checked + span { background: var(--g3); color: #3d2e00; }
.rate label:nth-child(3) input:checked + span small { color: #3d2e00; }
.rate label:nth-child(4) input:checked + span { background: var(--g4); }
.rate label:nth-child(5) input:checked + span { background: var(--g5); }
.pctrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pctrow .in { width: 110px; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { min-height: 40px; min-width: 52px; border-radius: 99px; border: 1px solid var(--line-2); background: #fff; cursor: pointer; }
.quick button:hover { border-color: var(--accent); color: var(--pri); }
.sticky { position: sticky; bottom: 70px; z-index: 3; box-shadow: 0 -4px 18px rgba(11,79,73,.08); }
.sec-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; border-bottom: 1px solid var(--line); margin: 0 0 12px; padding-bottom: 8px; }

/* fields */
label.f { display: block; margin: 0 0 12px; }
label.f > span { display: block; font-size: 14.5px; color: var(--muted); margin-bottom: 4px; }
.in, select.in, textarea.in { width: 100%; min-height: 46px; padding: 10px 14px; border: 1px solid var(--line-2); border-radius: 14px; background: #fff; }
textarea.in { min-height: 84px; resize: vertical; }
.in:focus { outline: 3px solid #bfe3d0; border-color: var(--accent); }
.check { display: flex; gap: 10px; align-items: center; min-height: 44px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--pri); }

/* KPI editor */
.item { border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 10px; background: #f9fcfa; }
.wsum { font-weight: 700; padding: 8px 12px; border-radius: 12px; }
.wsum.good { background: var(--ok-2); color: var(--ok); } .wsum.bad { background: var(--bad-2); color: var(--bad); }

/* tables + lists */
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 9px 8px; text-align: left; vertical-align: top; }
.tbl th { color: var(--muted); font-weight: 600; background: #f6faf8; font-size: 14px; }
.tbl tbody tr:hover td { background: #fafdfb; }
.tbl td.n, .tbl th.n { text-align: right; white-space: nowrap; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.list-row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); min-height: 56px; cursor: pointer; }
.list-row:last-child { border-bottom: 0; }
.tabs { display: flex; gap: 4px; overflow-x: auto; margin: 0 0 16px; padding: 4px; background: #fff; border: 1px solid var(--line); border-radius: 999px; width: max-content; max-width: 100%; }
.tabs a { white-space: nowrap; padding: 6px 16px; border-radius: 99px; text-decoration: none; color: var(--ink); min-height: 38px; display: flex; align-items: center; font-weight: 600; font-size: 15px; }
.tabs a:hover { background: #f1f7f4; }
.tabs a.on { background: var(--pri); color: #fff; }

/* result */
.big { font-size: 44px; font-weight: 700; line-height: 1.1; color: var(--head); }
.grade { display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 18px; font-size: 34px; font-weight: 700; color: #fff; }
.grade.A { background: var(--g5); } .grade.B { background: var(--g4); } .grade.C { background: var(--g3); color: #3d2e00; }
.grade.D { background: var(--g2); } .grade.E { background: var(--g1); } .grade.none { background: #8a9a95; font-size: 16px; }
.vbars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; align-items: end; height: 190px; padding-top: 6px; }
.vbars .col { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.vbars .track { width: 100%; max-width: 72px; flex: 1; background: #e9f1ed; border-radius: 16px; display: flex; align-items: flex-end; overflow: hidden; }
.vbars .fill { width: 100%; background: var(--teal); border-radius: 16px; color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; min-height: 30px; }
.vbars .fill.hi { background: var(--lime); color: #0b3d38; }
.vbars .lbl { font-size: 14px; color: var(--muted); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 13.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.rbar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; gap: 3px; background: #e9f1ed; }
.rbar i { display: block; height: 100%; border-radius: 99px; min-width: 6px; }

#toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); max-width: calc(100% - 32px); background: #0b3d38; color: #fff; padding: 10px 18px; border-radius: 14px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; white-space: pre-line; }
#toast.show { opacity: 1; } #toast.err { background: var(--bad); } #toast.ok { background: var(--ok); }
#busy { position: fixed; inset: 0; background: rgba(255,255,255,.5); z-index: 30; display: grid; place-items: center; }
#busy span { width: 40px; height: 40px; border-radius: 50%; border: 4px solid var(--pri-2); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { #busy span { animation-duration: 2.4s; } #toast { transition: none; } }
[hidden] { display: none !important; }
a.card { color: inherit; text-decoration: none; }
a.card:hover { border-color: var(--line-2); box-shadow: 0 12px 26px -16px rgba(11,79,73,.4); }
.grade.sm { width: 40px; height: 40px; font-size: 20px; border-radius: 12px; flex: none; }
.item.miss { border-color: var(--bad); background: var(--bad-2); }

/* print (A4) */
.print-only { display: none; }
@media print {
  @page { size: A4; margin: 14mm; }
  body, body.app { background: #fff; padding: 0; font-size: 12.5px; }
  #top, #nav, #side, #demo-bar, #toast, .no-print, .crumbs { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .card { border: 0; box-shadow: none; padding: 0; }
  .print-only { display: block; }
  .tbl th, .tbl td { border: 1px solid #555; padding: 4px 6px; }
  .tbl th { background: #eee !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
.sign { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; text-align: center; margin-top: 28px; }
.sign div { padding-top: 70px; }

/* ===== evaluation forms (modern layout) ===== */
.avatar.lg { width: 56px; height: 56px; font-size: 22px; }
.fhead { padding: 18px 20px; }
.fh-top { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.fh-kind { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 2px; }
.fhead h1 { font-size: clamp(20px, 2.6vw, 26px); margin: 0; }
.chip.fkind { background: var(--lime); color: var(--head); font-weight: 700; }
.scale { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 14px 0 0; padding-top: 12px; border-top: 1px dashed var(--line-2); font-size: 14px; color: var(--muted); }
.scale span { display: inline-flex; align-items: center; gap: 6px; }
.scale i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.fnote { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 14px; color: var(--pri); background: var(--pri-2); padding: 6px 12px; border-radius: 12px; }
.fnote svg.i { width: 16px; height: 16px; }
.ftiles-h { margin-top: 14px; }
.ftiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 10px; margin-top: 6px; }
.ftile { background: #f4faf7; border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; }
.ftile small { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.4; }
.ftile b { font-size: 21px; color: var(--head); line-height: 1.3; }
.ftile b span { font-size: 14px; color: var(--muted); font-weight: 600; }
.fsec { padding: 16px 20px 8px; }
.fsec-h { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.fsec-h h2 { margin: 0; font-size: 17px; }
.snum { width: 36px; height: 36px; border-radius: 12px; background: var(--pri); color: var(--lime); display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; }
.snum svg.i { width: 18px; height: 18px; }
.sprog { font-size: 13.5px; font-weight: 700; color: var(--pri); background: var(--pri-2); border-radius: 99px; padding: 1px 10px; white-space: nowrap; }
.sprog.full { background: var(--lime); color: var(--head); }
.qlist { margin-top: 6px; }
.qrow { display: grid; gap: 10px; padding: 14px 0; border-top: 1px solid var(--line); }
.qlist > .qrow:first-child { border-top: 0; }
.qt { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; line-height: 1.55; }
.qn { flex: none; width: 28px; height: 28px; border-radius: 50%; background: #edf3f0; color: var(--muted); display: grid; place-items: center; font-size: 14px; font-weight: 700; margin-top: 1px; transition: background .15s; }
.qrow.ans .qn { background: var(--lime); color: var(--head); }
.qrow.miss { background: var(--bad-2); box-shadow: inset 4px 0 0 var(--bad); border-radius: 14px; padding-left: 14px; padding-right: 14px; }
.qrow.miss .qtx::after { content: " · ກະລຸນາເລືອກຄະແນນ"; color: var(--bad); font-size: 14px; font-weight: 600; }
.qrow.krow.miss .qtx::after { content: " · ກະລຸນາໃສ່ % (0–100)"; }
.kin { display: flex; flex-direction: column; gap: 8px; }
.pin { display: flex; align-items: center; gap: 8px; }
.pin .in { width: 110px; }
.pin span { font-weight: 600; color: var(--muted); }
.tgrid { display: grid; gap: 0 16px; padding-bottom: 4px; margin-top: 8px; }
@media (min-width: 900px) {
  .qrow { grid-template-columns: minmax(0, 1fr) 340px; align-items: center; gap: 20px; }
  .tgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tgrid .wide { grid-column: 1 / -1; }
}
.fbar { position: sticky; bottom: 70px; z-index: 3; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: #fff; border: 1px solid var(--line); border-radius: 26px; padding: 10px 12px 10px 20px; box-shadow: 0 16px 32px -14px rgba(11,79,73,.4); margin: 0 0 16px; }
.fb-prog { flex: 1; min-width: 150px; }
.fb-prog .t { font-size: 14.5px; font-weight: 600; color: var(--head); }
.fbar > .btn { flex: 1 1 150px; }
.fbar .btn .rdy { display: none; }
.fbar .btn.ready .rdy { display: inline-flex; }
.fbar .btn.ready { box-shadow: 0 0 0 4px rgba(214,234,113,.75); }
.fbar .bar > i { transition: width .25s ease; }
@media (prefers-reduced-motion: reduce) { .fbar .bar > i, .qn { transition: none; } }
@media (min-width: 1024px) { .fbar { bottom: 12px !important; } }
/* KPI editor + generic field grid */
.kitem { display: flex; gap: 12px; align-items: flex-start; }
.kitem .qn { margin-top: 24px; }
.kfields { flex: 1; min-width: 0; display: grid; gap: 0 14px; }
.kitem .icon-btn { flex: none; margin-top: 22px; }
.kitem .icon-btn:hover { color: var(--bad); border-color: var(--bad); }
.kbar .wsum { flex: 1 1 200px; }
.kbtns { display: flex; gap: 10px; flex-wrap: wrap; flex: 1 1 260px; }
.kbtns .btn { flex: 1 1 130px; }
.fgrid { display: grid; gap: 0 14px; }
@media (min-width: 760px) {
  .kfields { grid-template-columns: minmax(0, 2fr) minmax(0, 2fr) 110px; }
  .fgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.quick button { min-width: 44px; }
.fbar > .btn { max-width: 260px; }
@media (max-width: 479px) { .fbar > .btn { max-width: none; } }

/* letterhead on the printed KPI form (from the company manual) */
.lh { display: block; width: 100%; height: auto; }
.lh.bot { margin-top: 22px; }


/* ===== kid-friendly pass: heavier type, big plain buttons, faces, hero ===== */
h1, h2, h3 { font-weight: 800; }
b, strong, th, legend { font-weight: 700; }
.btn { min-height: 54px; padding: 10px 22px; font-size: 17px; font-weight: 700; gap: 8px; border-width: 2px; }
.btn.sm { min-height: 44px; font-size: 15px; padding: 6px 16px; }
.btn.pri { box-shadow: 0 8px 18px -10px rgba(11,79,73,.7); }
.btn svg.i, .pill-btn svg.i, .back svg.i { width: 22px; height: 22px; stroke-width: 2.2; }
.pill-btn { min-height: 46px; padding: 6px 18px; font-size: 16px; font-weight: 700; gap: 6px; }
.back { min-height: 46px; padding: 6px 16px 6px 12px; margin: 0 0 12px; border-radius: 99px; background: #fff; border: 2px solid var(--line-2); color: var(--head); font-weight: 700; text-decoration: none; }
.back:hover { border-color: var(--accent); }
.icon-btn.lab { width: auto; min-width: 46px; height: 46px; padding: 0 14px; border-radius: 99px; gap: 6px; display: inline-flex; align-items: center; font-weight: 700; color: var(--head); border-width: 2px; }
.icon-btn { border-width: 2px; }
.icon-btn.lab svg.i { width: 20px; height: 20px; }
.link { font-weight: 700; }
.tabs a { min-height: 46px; font-weight: 700; gap: 6px; }
.tabs a svg.i { width: 18px; height: 18px; }
#nav a { font-weight: 700; font-size: 13.5px; }
.in, select.in, textarea.in { min-height: 52px; font-size: 17px; border-width: 2px; }
label.f > span { font-weight: 700; color: var(--head); }
.chip { font-weight: 700; }
.muted { color: var(--muted); }
.qlabel { font-size: 14px; font-weight: 700; color: var(--muted); }
.quick button { min-height: 46px; min-width: 52px; font-size: 16px; font-weight: 700; border-width: 2px; }

/* rating faces */
.rate { gap: 8px; }
.rate span { min-height: 92px; gap: 2px; padding: 8px 2px; border-width: 2px; border-radius: 16px; }
.rate .face { width: 34px; height: 34px; display: block; }
.rate .face svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.rate .face svg circle.eye { fill: currentColor; stroke: none; }
.rate span b { font-size: 20px; line-height: 1.1; font-weight: 800; }
.rate span small { font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.2; }
.rate label:nth-child(1) .face { color: #c53030; } .rate label:nth-child(2) .face { color: #d9731a; } .rate label:nth-child(3) .face { color: #a87c00; }
.rate label:nth-child(4) .face { color: #5f9a1e; } .rate label:nth-child(5) .face { color: #17703c; }
.rate input:checked + span .face, .rate input:checked + span small { color: #fff; }
.rate label:nth-child(3) input:checked + span .face, .rate label:nth-child(3) input:checked + span small { color: #3d2e00; }
.rate input:checked + span { box-shadow: 0 8px 16px -8px rgba(0,0,0,.45); }
@media (max-width: 420px) { .rate { gap: 5px; } .rate span small { font-size: 12px; } .rate .face { width: 30px; height: 30px; } }

/* "next task" hero on home */
.hero { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: linear-gradient(135deg, #0b4f49 0%, #0f6a62 100%); color: #fff; border-radius: 24px; padding: 20px 22px; margin: 0 0 16px; box-shadow: 0 18px 32px -20px rgba(11,79,73,.8); }
.hero-ic { flex: none; width: 60px; height: 60px; border-radius: 20px; background: rgba(255,255,255,.16); color: var(--lime); display: grid; place-items: center; }
.hero-ic svg.i { width: 32px; height: 32px; stroke-width: 2.2; }
.hero .grow { min-width: 200px; }
.hero-k { font-size: 14px; font-weight: 700; color: var(--lime); letter-spacing: .02em; }
.hero-t { font-size: 21px; font-weight: 800; line-height: 1.4; color: #fff; }
.hero-s { font-size: 15px; color: rgba(255,255,255,.92); }
.hero-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 58px; padding: 10px 28px; border-radius: 99px; background: var(--lime); color: var(--head); font-size: 19px; font-weight: 800; text-decoration: none; box-shadow: 0 10px 20px -10px rgba(0,0,0,.5); flex: 0 0 auto; }
.hero-btn:hover { background: #e4f58a; }
.hero-btn svg.i { width: 24px; height: 24px; stroke-width: 2.4; }
.hero.done { background: linear-gradient(135deg, #14703c 0%, #1f8a4c 100%); }
@media (max-width: 560px) { .hero-btn { width: 100%; } }

/* clearer top bar logout */
.who .nm span { font-size: 14px; }
.rate label { display: flex; }
.rate label > span { flex: 1; justify-content: flex-start; }
</style>

const GRADES = [[95, 'A', 'ຜົນງານເກີນເປົ້າໝາຍ'], [85, 'B', 'ບັນລຸເປົ້າໝາຍຄົບຖ້ວນ'], [75, 'C', 'ຢູ່ໃນເກນມາດຕະຖານ (ຕ້ອງພັດທະນາຕື່ມ)'],
  [65, 'D', 'ຫຼຸດມາດຕະຖານ'], [-1, 'E', 'ບໍ່ຜ່ານມາດຕະຖານ']];

function pct15(arr) { return arr && arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length / 5 * 100 : null; }
function round1(x) { return Math.round((x + 1e-9) * 10) / 10; }
function grade(total) { return total == null ? null : GRADES.find(g => total >= g[0])[1]; }
function gradeText(g) { const r = GRADES.find(x => x[1] === g); return r ? r[2] : ''; }
function hasSub(cfg, code) { const g = cfg.groups[code]; return !!g && g.split.sub > 0; }
function avg(list) { return list.length ? list.reduce((a, b) => a + b, 0) / list.length : null; }

// items: KPI ດ້ານ I [{w}], f1 = {i:[% ບັນລຸ], iii:[1-5], iv:[1-5]}, f2 = {q:[1-5], s:[1-5]}, f3list/f4list = [{q:[1-5]}]
function score(cfg, code, items, f1, f2, f3list, f4list) {
  const g = cfg.groups[code], w = g.w, sp = g.split;
  const parts = {
    sup: f2 ? pct15(f2.q) : null,
    sac: f2 ? pct15(f2.s) : null,
    peer: avg((f3list || []).map(a => pct15(a.q))),
    sub: sp.sub > 0 ? avg((f4list || []).map(a => pct15(a.q))) : null
  };
  let num = 0, den = 0, redistributed = false;
  for (const k of ['sup', 'sub', 'peer', 'sac']) {
    if (!sp[k]) continue;
    if (parts[k] == null) { redistributed = true; continue; }
    num += parts[k] * sp[k]; den += sp[k];
  }
  const II = (den ? num / den : 0) * w[1] / 100;
  const n = { peer: (f3list || []).length, sub: (f4list || []).length };
  if (!f1) return { complete: false, I: null, II, III: null, IV: null, total: null, grade: null, parts, n, redistributed };
  const I = items.reduce((s, it, idx) => s + (Number(f1.i[idx]) || 0) * it.w / 100, 0);
  const III = (pct15(f1.iii) || 0) * w[2] / 100;
  const IV = w[3] ? (pct15(f1.iv) || 0) * w[3] / 100 : 0;
  const total = round1(I + II + III + IV);
  return { complete: true, I, II, III, IV, total, grade: grade(total), parts, n, redistributed };
}

function validateConfig(cfg) {
  const errs = [];
  for (const [k, g] of Object.entries(cfg.groups || {})) {
    if (g.w.reduce((a, b) => a + Number(b), 0) !== 100) errs.push(`ກຸ່ມ ${g.name}: ນ້ຳໜັກ 4 ດ້ານ ລວມຕ້ອງ = 100`);
    if (Object.values(g.split).reduce((a, b) => a + Number(b), 0) !== 100) errs.push(`ກຸ່ມ ${g.name}: ສັດສ່ວນດ້ານ II ລວມຕ້ອງ = 100`);
    if (!g.iii.length) errs.push(`ກຸ່ມ ${g.name}: ຕ້ອງມີລາຍການດ້ານ III`);
    if (g.w[3] > 0 && !g.iv.length) errs.push(`ກຸ່ມ ${g.name}: ຕ້ອງມີລາຍການດ້ານ IV`);
    if (!cfg.questions[g.q2]) errs.push(`ກຸ່ມ ${g.name}: ບໍ່ພົບຊຸດຄຳຖາມ ${g.q2}`);
  }
  for (const q of ['sac', 'peer', 'sub']) if (!(cfg.questions[q] || []).length) errs.push(`ຊຸດຄຳຖາມ ${q} ຫວ່າງ`);
  return errs;
}

if (typeof module !== 'undefined') module.exports = { DEFAULT_CONFIG, GRADES, pct15, round1, grade, gradeText, hasSub, score, validateConfig };

/* ===== server.js ===== */
// ກົດລະບຽບ ແລະ ສິດທັງໝົດ ຢູ່ບ່ອນນີ້. ແລ່ນໄດ້ທັງ Apps Script, browser (ໂໝດທົດລອງ) ແລະ node tests.
// store = {load, save(db, tables), hash, now, uuid, lock(fn)}
const SC = typeof require !== 'undefined' && typeof module !== 'undefined'
  ? require('./scoring.js') : { DEFAULT_CONFIG, score, hasSub, validateConfig };
const TABLES = ['staff', 'rounds', 'kpi', 'peers', 'answers', 'sessions', 'results', 'roles'];
const ROUND_FLOW = { setup: ['eval'], eval: ['setup', 'closed'], closed: ['eval', 'published'], published: ['closed'] };
// ສິດທີ່ Admin ກຳນົດໃຫ້ແຕ່ລະບົດບາດໄດ້. ADMIN ມີທຸກສິດ ແລະ ແກ້ໄຂບໍ່ໄດ້.
const PERMS = ['staff', 'roles', 'round', 'peers', 'config', 'kpiReview', 'kpiFinal', 'progress', 'results'];
const DEFAULT_ROLES = [
  { code: 'ADMIN', name: 'ຜູ້ດູແລລະບົບ (Admin)', perms: PERMS.slice() },
  { code: 'HR', name: 'HR', perms: PERMS.filter(p => p !== 'roles' && p !== 'kpiFinal') },
  { code: 'PRESIDENT', name: 'ປະທານ', perms: ['kpiFinal'] }
];
const clone = o => JSON.parse(JSON.stringify(o));

function permsOf(s, roles) {
  return new Set((s.roles || []).flatMap(c => (roles.find(r => r.code === c) || { perms: [] }).perms));
}
function E(msg) { const e = new Error(msg); e.user = true; return e; }
const NOAUTH = 'ກະລຸນາເຂົ້າລະບົບໃໝ່';
const NOPERM = 'ທ່ານບໍ່ມີສິດເຮັດລາຍການນີ້';

function handle(req, store) {
  try { return store.lock(() => run(req || {}, store)); }
  catch (e) { return { ok: false, err: e.user ? e.message : 'ລະບົບຜິດພາດ: ' + e.message }; }
}

function run(req, store) {
  const db = store.load();
  for (const k of TABLES) db[k] = db[k] || [];
  if (!db.roles.length) db.roles = clone(DEFAULT_ROLES);
  const adm = db.roles.find(r => r.code === 'ADMIN');
  if (adm) adm.perms = PERMS.slice(); else db.roles.unshift(clone(DEFAULT_ROLES[0]));
  const X = ctx(db, db.config || clone(SC.DEFAULT_CONFIG), store);
  if (req.a === 'login') return login(X, req);
  const fn = ACTIONS[req.a];
  if (!fn) throw E('ບໍ່ຮູ້ຈັກຄຳສັ່ງ');
  const u = X.auth(req.t);
  fn(X, u, req);
  if (X.ch.size) store.save(db, [...X.ch]);
  return { ok: true, boot: boot(X, u, req) };
}

function ctx(db, cfg, store) {
  const X = { db, cfg, store, ch: new Set(), now: store.now() };
  X.by = code => db.staff.find(s => s.code === code);
  X.active = () => db.staff.filter(s => s.active !== false);
  X.evaluated = s => !!s && s.active !== false && !!cfg.groups[s.group];
  X.subs = code => X.active().filter(s => s.sup === code);
  // bootstrap: ຖ້າບໍ່ມີໃຜມີສິດ "ກຳນົດສິດ", ຄົນທີ່ມີສິດ "ຈັດການພະນັກງານ" ໄດ້ສິດນັ້ນ (ກັນລັອກຕົນເອງອອກ)
  X.perms = u => {
    const p = permsOf(u, db.roles);
    if (!p.has('roles') && p.has('staff') && !X.active().some(s => permsOf(s, db.roles).has('roles'))) p.add('roles');
    return p;
  };
  X.can = (u, p) => X.perms(u).has(p);
  X.pres = () => X.active().find(s => X.can(s, 'kpiFinal'));
  X.approverOf = e => { if (e.appr) return e.appr; const s = X.by(e.sup); return (s && s.sup) || null; };
  X.openRound = () => db.rounds.find(r => r.status === 'setup' || r.status === 'eval');
  X.round = id => (id && db.rounds.find(r => r.id === id)) || X.openRound() || db.rounds[db.rounds.length - 1] || null;
  X.kpi = (rid, emp) => db.kpi.find(k => k.round === rid && k.emp === emp);
  X.subAns = (rid, form, emp) => db.answers.filter(a => a.round === rid && a.form === form && a.emp === emp && a.status === 'sub');
  X.auth = t => {
    const s = t && db.sessions.find(x => x.t === t && x.exp > X.now);
    const u = s && X.by(s.code);
    if (!u || u.active === false) throw E(NOAUTH);
    return u;
  };
  X.need = cond => { if (!cond) throw E(NOPERM); };
  return X;
}

// ---------- login ----------
function login(X, req) {
  const code = String(req.code || '').trim().toUpperCase();
  const s = X.db.staff.find(x => x.code === code && x.active !== false);
  if (!s || !s.pin) throw E('ລະຫັດ ຫຼື PIN ບໍ່ຖືກ');
  if ((s.lockUntil || 0) > X.now) throw E('ໃສ່ PIN ຜິດຫຼາຍເທື່ອ, ລອງໃໝ່ຫຼັງ 15 ນາທີ');
  if (X.store.hash(String(req.pin || '')) !== s.pin) {
    s.fails = (s.fails || 0) + 1;
    if (s.fails >= 5) { s.lockUntil = X.now + 15 * 60e3; s.fails = 0; }
    X.store.save(X.db, ['staff']);
    throw E('ລະຫັດ ຫຼື PIN ບໍ່ຖືກ');
  }
  s.fails = 0; s.lockUntil = 0;
  X.db.sessions = X.db.sessions.filter(x => x.exp > X.now);
  const t = X.store.uuid();
  X.db.sessions.push({ t, code: s.code, exp: X.now + 30 * 864e5 });
  X.store.save(X.db, ['staff', 'sessions']);
  return { ok: true, token: t, boot: boot(X, s, req) };
}

// ---------- KPI ----------
function kpiFor(X, u, emp, wantSup) {
  const r = X.openRound();
  if (!r) throw E('ບໍ່ມີຮອບປະເມີນທີ່ເປີດຢູ່');
  const e = X.by(emp);
  if (!X.evaluated(e)) throw E('ບໍ່ພົບພະນັກງານທີ່ຖືກປະເມີນ');
  if (wantSup) X.need(e.sup === u.code);
  return { r, e, k: X.kpi(r.id, e.code) };
}
function hist(X, k, u, act, msg) { k.hist = (k.hist || []).concat({ at: X.now, by: u.code, act, msg: msg || '' }); X.ch.add('kpi'); }
function decide(X, u, k, ok, msg, next) {
  if (!ok && !String(msg || '').trim()) throw E('ກະລຸນາຂຽນເຫດຜົນທີ່ສົ່ງກັບ');
  k.status = ok ? next : 'draft';
  hist(X, k, u, ok ? 'ອະນຸມັດ' : 'ສົ່ງກັບ', msg);
}
const afterAppr = X => X.pres() ? 'pres' : 'ok';

// ---------- answers ----------
function canEval(X, u, form, e, r) {

}
function cleanAns(X, form, e, k, a) {

      throw E('ກະລຸນາໃສ່ % ບັນລຸ (0–100) ທຸກຕົວຊີ້ວັດ');
    return { i, iii: r15(a.iii, g.iii.length), iv: r15(a.iv || [], g.w[3] ? g.iv.length : 0), str: txt(a.str), imp: txt(a.imp), cmt: txt(a.cmt) };

// ---------- results ----------
function result(X, r, e) {

  const latest = f => { const l = X.subAns(r.id, f, e.code); return l.length ? l.reduce((a, b) => (a.at >= b.at ? a : b)).ans : null; };
  const assigned = new Set(X.db.peers.filter(p => p.round === r.id && p.emp === e.code).map(p => p.by));
  const f3 = X.subAns(r.id, 3, e.code).filter(a => assigned.has(a.by)).map(a => a.ans);
  const f4 = SC.hasSub(X.cfg, e.group) ? X.subAns(r.id, 4, e.code).map(a => a.ans) : [];

function pub(s, full) {

}

  if (own && own.status === 'ack') D.push({ kind: 'kpiAck', emp: u.code, done: false });
  for (const k of X.db.kpi.filter(k => k.round === r.id)) {
    const e = X.by(k.emp); if (!X.evaluated(e)) continue;
    if (k.status === 'hr' && X.can(u, 'kpiReview')) D.push({ kind: 'kpiHr', emp: e.code, done: false });
    if (k.status === 'appr' && X.approverOf(e) === u.code) D.push({ kind: 'kpiAppr', emp: e.code, done: false });

    for (const e of subs) {

      if (X.evaluated(X.by(p.emp))) D.push({ kind: 'f3', emp: p.emp, done: mine(3, p.emp) });
    const sup = X.by(u.sup);
    if (X.evaluated(sup) && SC.hasSub(X.cfg, sup.group)) D.push({ kind: 'f4', emp: sup.code, done: mine(4, sup.code) });

  let results = [];
  if (r && P.has('results')) results = evals.map(e => result(X, r, e));
  else if (r && r.status === 'published')
    results = evals.filter(e => e.code === u.code || e.sup === u.code).map(e => mask(result(X, r, e)));
  const out = {
    me: Object.assign(pub(u, true), { perms: [...P] }), staff: (full ? X.db.staff : X.active()).map(s => pub(s, full)), config: X.cfg,
    roles: X.db.roles,
    rounds: X.db.rounds, round: r,
    kpi: r ? X.db.kpi.filter(k => k.round === r.id && canSeeKpi(X, u, k)) : [],
    duties: duties(X, u, r),
    answersMine: r ? X.db.answers.filter(a => a.round === r.id && a.by === u.code) : [],
    results, approvers: {}, hr: null
  };
  for (const k of out.kpi) { const e = X.by(k.emp); out.approvers[k.emp] = e ? X.approverOf(e) : null; }
  if (hr && r) {
    out.hr = {
      peers: X.db.peers.filter(p => p.round === r.id),
      answers: !P.has('progress') ? [] : X.db.answers.filter(a => a.round === r.id).map(a => ({ id: a.id, form: a.form, emp: a.emp, by: a.by, status: a.status, at: a.at })),
      progress: evals.map(e => {
        const assigned = X.db.peers.filter(p => p.round === r.id && p.emp === e.code).map(p => p.by);
        const k = X.kpi(r.id, e.code);
        return {
          emp: e.code, kpi: k ? k.status : 'none',
          f1: X.subAns(r.id, 1, e.code).length > 0, f2: X.subAns(r.id, 2, e.code).length > 0,
          f3: { done: X.subAns(r.id, 3, e.code).filter(a => assigned.includes(a.by)).length, of: assigned.length },
          f4: SC.hasSub(X.cfg, e.group) ? { done: X.subAns(r.id, 4, e.code).length, of: X.subs(e.code).length } : null,
          noSup: !X.by(e.sup)

  }

}

      const r = await call('staffSave', { row }, { noRender: true });
      if (r.ok) { toast('ບັນທຶກແລ້ວ', 'ok'); go('#hr/staff'); } else render();
    },
    async setPin() {
      const code = location.hash.split('/')[2], pin = $('#newpin').value;
      const r = await call('setPin', { code: decodeURIComponent(code), pin }, { noRender: true });
      if (r.ok) toast('ຕັ້ງ PIN ແລ້ວ', 'ok');
      render();
    },
    async roleSave(form) {
      const fd = new FormData(form), code = String(fd.get('code') || '').trim().toUpperCase();
      const was = roleMembers(code).map(s => s.code), want = A.rsel ? A.rsel.list : was;
      if (code !== 'ADMIN') {
        const r = await call('roleSave', { role: { code, name: fd.get('name'), perms: fd.getAll('perm') } }, { noRender: true });
        if (!r.ok) return render();
      }
      const changed = A.B.staff.filter(s => was.includes(s.code) !== want.includes(s.code)).map(s => {
        const roles = (s.roles || []).filter(x => x !== code).concat(want.includes(s.code) ? [code] : []);
        return { code: s.code, name: s.name, dept: s.dept, div: s.div, pos: s.pos, group: s.group, sup: s.sup, appr: s.appr, roles, active: s.active };
      });
      if (changed.length && can('staff')) {
        const r2 = await call('staffImport', { rows: changed }, { noRender: true });
        if (!r2.ok) return render();
      }
      toast('ບັນທຶກແລ້ວ — ມີຜົນທັນທີ', 'ok'); A.rsel = null; go('#hr/roles');
    },
    async roundCreate() {
      const r = await call('roundCreate', { name: $('#rn').value, copyKpi: $('#rcopy').checked }, { noRender: true });
      A.roundSel = null;
      if (r.ok) toast('ສ້າງຮອບແລ້ວ', 'ok');
      render();
    }
  };
  function dlCsv(name, rows) {
    const csv = '﻿' + rows.map(r => r.map(v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }

  document.addEventListener('click', e => {
    const go2 = e.target.closest('[data-go]');
    if (go2 && !e.target.closest('a,button')) return go(go2.dataset.go);
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    e.preventDefault();
    ACT[el.dataset.act](el, e);
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest('[data-submit]');
    if (!f) return;
    e.preventDefault(); SUBMIT[f.dataset.submit](f);
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.kf && A.kedit) { A.kedit.items[Number(t.dataset.i)][t.dataset.kf] = t.value; updWsum(); }
    else if (t.closest('#fm')) updLive();
    else if (t.id === 'rq') { A.rq = t.value; render(); const q = $('#rq'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    else if (t.id === 'hr-q') { A.hrQ = t.value; render(); const q = $('#hr-q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.closest('#fm')) updLive();
    else if (t.id === 'hr-dept') { A.hrDept = t.value; render(); }
    else if (t.id === 'hr-todo') { A.hrTodo = t.checked; render(); }
    else if (t.classList.contains('rmem')) {
      const l = A.rsel.list;
      if (t.checked) { if (!l.includes(t.value)) l.push(t.value); } else l.splice(l.indexOf(t.value), 1);
      const h3 = $('#rmem-n'); if (h3) h3.textContent = `ຄົນທີ່ມີບົດບາດນີ້ (${l.length})`;
    }
    else if (t.id === 'pres-all') $$('.pres-k').forEach(x => { x.checked = t.checked; });
    else if (t.classList.contains('peer-c')) {
      const l = A.peerSel.list;
      if (t.checked) { if (!l.includes(t.value)) l.push(t.value); } else l.splice(l.indexOf(t.value), 1);
      render();
    } else if (t.id === 'demo-who') {
      const code = t.value;
      call('logout', {}, { noRender: true }).then(() => call('login', { code, pin: '1234' })).then(r => { if (r.ok) go('#home'); });
    }
  });
  window.addEventListener('hashchange', render);

  // ---------- start ----------
  const qApi = new URLSearchParams(location.search).get('api');
  if (qApi && /^https:\/\/script\.google\.com\/.+\/exec$/.test(qApi)) {
    LSS('kpi_api', qApi); LSS('kpi_mode', 'live'); A.api = qApi; A.mode = 'live';
    history.replaceState(null, '', location.pathname + location.hash);
  }
  if (A.mode === 'demo') A.store = makeDemoStore();
  if (A.mode && LSG(tokKey())) call('boot'); else render();
})();
</script>
</body>
